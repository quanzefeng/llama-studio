appId: com.llamastudio.app
productName: Llama Studio
directories:
  output: build
  buildResources: resources
win:
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
files:
  - out/**/*
  - package.json
  - "!**/*.{ts,tsx,map}"
asarUnpack: []
# 引擎打进安装包:两个目录从仓库根复制到 resources/engines/{llama,cudart}
# 本机开发:把引擎目录建 junction/复制为 llama-engine、cudart-engine(见 README)
# GitHub Actions:workflow 下载引擎后同样放到这两个目录
extraResources:
  - from: ../llama-engine
    to: engines/llama
  - from: ../cudart-engine
    to: engines/cudart