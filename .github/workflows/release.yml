# 构建 + 发布安装包:推送 v* tag 时自动打包 .exe 并上传到 GitHub Releases
# 引擎来源:llama.cpp 官方 release(CUDA 12.4 x64),与本机开发版本一致可改 LLAMA_BUILD

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发:可仅试打包,也可直接发布(需打开 Release 开关)
    inputs:
      release:
        description: '创建/更新 GitHub Release(默认开启;关闭则仅产出安装包 artifact)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # llama.cpp 构建版本号:zip 资产名形如 llama-b10707-bin-win-cuda-12.4-x64.zip
  # 升级引擎只需改这里;发布的安装包会自动内置该版本引擎
  LLAMA_BUILD: b10707
  CUDA_VER: 12.4

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: llama-studio-app/package-lock.json

      - name: Install deps
        working-directory: llama-studio-app
        run: npm ci

      # ---- 下载并准备引擎(llama.cpp win zip 为平铺结构,直接解压到固定目录) ----
      - name: Download llama.cpp binaries
        run: |
          curl -L -o llama.zip "https://github.com/ggml-org/llama.cpp/releases/download/${{ env.LLAMA_BUILD }}/llama-${{ env.LLAMA_BUILD }}-bin-win-cuda-${{ env.CUDA_VER }}-x64.zip"
          New-Item -ItemType Directory -Force -Path llama-engine | Out-Null
          tar -xf llama.zip -C llama-engine
          Remove-Item llama.zip

      - name: Download CUDA runtime (cudart-llama)
        run: |
          curl -L -o cudart.zip "https://github.com/ggml-org/llama.cpp/releases/download/${{ env.LLAMA_BUILD }}/cudart-llama-bin-win-cuda-${{ env.CUDA_VER }}-x64.zip"
          New-Item -ItemType Directory -Force -Path cudart-engine | Out-Null
          tar -xf cudart.zip -C cudart-engine
          Remove-Item cudart.zip

      - name: Verify engine ready
        run: |
          if (-not (Test-Path 'llama-engine\llama-server.exe')) { throw 'llama-server.exe missing' }
          if (-not (Test-Path 'cudart-engine\cudart64_12.dll')) { throw 'cudart64_12.dll missing' }
          Write-Host "engine dirs OK: llama-engine + cudart-engine"

      # ---- 计算本次要发布的版本号 ----
      # push tag 时直接用 tag 名(如 v0.1.1);手动触发时从 package.json 读 version(如 0.1.1)
      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v$(node -p "require('./llama-studio-app/package.json').version")"
          fi
          echo "RELEASE_TAG=${VER}" >> "$GITHUB_ENV"
          echo "Resolved release tag: ${VER}"

      # ---- 打包安装包(extraResources 会把引擎打进 resources/engines/) ----
      - name: Build installer
        working-directory: llama-studio-app
        run: npm run build:win

      # ---- 上传产物 + 发布 Release(幂等:create 失败→upload 补资产)----
      # 触发条件:推送了 v* tag,或手动触发且打开了 Release 开关
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        shell: bash
        run: |
          # 已存在则跳过创建,否则新建(draft 避免半成品可见)
          gh release create "${RELEASE_TAG}" \
            --title "Llama Studio ${RELEASE_TAG}" \
            --notes "内置 llama.cpp ${{ env.LLAMA_BUILD }} (CUDA ${{ env.CUDA_VER }}) 引擎。下载后直接安装,无需另行配置引擎。" \
            --generate-notes || true
          # 上传/覆盖安装包资产(--clobber 支持重跑)
          gh release upload "${RELEASE_TAG}" llama-studio-app/build/*.exe \
            --clobber \
            || true
          gh release view "${RELEASE_TAG}" --json name,assets --jq '.name + " assets: " + ([.assets[].name] | join(", "))'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (debug)
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: llama-studio-installer
          path: llama-studio-app/build/*.exe
          if-no-files-found: error